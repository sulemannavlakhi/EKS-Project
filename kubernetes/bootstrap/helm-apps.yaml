apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sulemannavlakhi/EKS-Project
    targetRevision: HEAD
    path: kubernetes/helm-values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true